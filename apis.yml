name: SinoMDT
description: Sino Medical-Device Technology Co., Ltd. (SinoMDT), founded in 2007 and
  headquartered in Shenzhen, China, is a high-tech medical equipment manufacturer that
  researches, designs, and produces accurate injection and infusion devices along with
  radiographic imaging diagnosis systems. Its product line spans the SN-50 series syringe
  pumps, SN-1500 series infusion pumps, SinoPower high-pressure contrast injectors used
  for CT/MRI/DSA enhanced scans, and molybdenum-anode film and full-digital mammography
  systems for breast radiographic diagnosis. SinoMDT is a portfolio company backed by
  Qiming Venture Partners. It manufactures physical medical hardware and publishes no
  public API, SDK, or developer platform.
